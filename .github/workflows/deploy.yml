name: 🚀 Build & Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # Allow manual trigger from GitHub UI

env:
  REGISTRY: ghcr.io
  GITHUB_USERNAME: karthik8402
  RESOURCE_GROUP: eSTAR-RG
  # Opt into Node.js 24 runtime for all GitHub Actions now (avoids deprecation warnings)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend-checks:
    name: Backend API Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: ./services/audit-trail-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/audit-trail-service/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile backend modules
        run: python -m compileall api config db agents shared_ai tests

      - name: Run backend API tests
        run: python -m unittest discover -s tests

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: ./landing-page

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: landing-page/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  # ─── Job 3: Deploy to Vercel (only on main branch) ───
  vercel-deploy:
    name: 📐 Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [frontend-checks]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Project Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./landing-page
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Copy pulled env vars to root
        run: |
          cp .vercel/.env.production.local .env.production.local
          cp .vercel/.env.production.local .env.production
        working-directory: ./landing-page

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./landing-page
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_API_GATEWAY_URL: https://audit-trail-service.onrender.com
          VITE_API_URL: https://audit-trail-service.onrender.com

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./landing-page
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: ✅ Vercel deployment complete
        run: echo "🌐 Frontend deployed to Vercel!"

  # ─── Job 4: Deploy to Render with Health Check (only on main branch) ───
  render-deploy:
    name: ⚡ Deploy to Render
    runs-on: ubuntu-latest
    needs: [backend-checks]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production

    steps:
      - name: Trigger Render Deploy
        run: |
          curl -f -s -X GET "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: 🔍 Poll Render Backend Health Check
        run: |
          echo "Polling Render backend health check..."
          max_attempts=30
          attempt=1
          until [ $attempt -gt $max_attempts ]
          do
            response=$(curl -s -w "\n%{http_code}" https://audit-trail-service.onrender.com/health || echo -e "\n500")
            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | head -n -1)
            echo "Attempt $attempt: HTTP Status $http_code"
            if [ "$http_code" -eq 200 ] && echo "$body" | grep -q '"status":"healthy"'; then
              echo "Backend is healthy! Deploy successful."
              exit 0
            fi
            echo "Waiting 15 seconds before next attempt..."
            sleep 15
            attempt=$((attempt+1))
          done
          echo "❌ Backend health check failed or timed out!"
          exit 1

