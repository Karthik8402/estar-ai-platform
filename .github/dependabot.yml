version: 2

updates:
  # ─── Auto-update GitHub Actions in all workflows ──────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"                     # Scans .github/workflows/*.yml
    schedule:
      interval: "weekly"               # Check every Monday
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    reviewers:
      - "Karthik8402"
    groups:
      # Group all docker/* action updates into a single PR
      docker-actions:
        patterns:
          - "docker/*"
      # Group all actions/* updates into a single PR
      github-core-actions:
        patterns:
          - "actions/*"

  # ─── Auto-update Python dependencies (backend) ────────────────────────────
  - package-ecosystem: "pip"
    directory: "/services/audit-trail-service"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"

  # ─── Auto-update npm dependencies (frontend) ──────────────────────────────
  - package-ecosystem: "npm"
    directory: "/landing-page"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Don't auto-bump major versions of these — they require manual testing
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router-dom"
        update-types: ["version-update:semver-major"]
